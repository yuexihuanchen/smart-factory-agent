spring:
  application:
    name: smart-factory-agent

  datasource:
    url: jdbc:mysql://localhost:3306/smart_factory?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

    mongodb:
      uri: ${MONGO_URI}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.smartfactory.entity

server:
  port: 8080

# SmartFactory-Agent 初始化管理员配置
smart-factory:
  bootstrap:
    admin:
      username: ${SMART_FACTORY_ADMIN_USERNAME:admin}
      password: ${SMART_FACTORY_ADMIN_PASSWORD}
      nickname: ${SMART_FACTORY_ADMIN_NICKNAME:系统管理员}