spring:
  application:
    name: smart-factory-agent

  datasource:
    url: jdbc:mysql://localhost:3306/smart_factory?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.smartfactory.entity

server:
  port: 8080
