spring:
  application:
    name: smart-factory-agent

  datasource:
    url: jdbc:mysql://localhost:3306/smart_factory?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

    mongodb:
      uri: ${MONGO_URI:mongodb://admin:admin123@localhost:27017/smart_factory?authSource=admin}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.smartfactory.entity

server:
  port: 8080